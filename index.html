          { bg: "#06B6D4", light: "rgba(6,182,212,0.1)", border: "rgba(6,182,212,0.2)", text: "#22D3EE" },
          { bg: "#EC4899", light: "rgba(236,72,153,0.1)", border: "rgba(236,72,153,0.2)", text: "#F472B6" },
          { bg: "#84CC16", light: "rgba(132,204,22,0.1)", border: "rgba(132,204,22,0.2)", text: "#A3E635" }

        const DAYS_KR = ["일", "월", "화", "수", "목", "금", "토"];
        const COOLDOWN_OPTIONS = [2, 3, 4, 5, 7, 10, 14, 30];

        function formatDate(y, m, d) {
          return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
        }

        function parseDate(str) {
          var parts = str.split("-").map(Number);
          return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function daysBetween(d1Str, d2Str) {
          var d1 = parseDate(d1Str);
          var d2 = parseDate(d2Str);
          return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
        }

          return new Date(y, m + 1, 0).getDate();
        }

        function getFirstDayOfMonth(y, m) {
          return new Date(y, m, 1).getDay();
        }

          var toggleLog = function(habitId, dateStr) {
            setHabits(function(prev) {
              return prev.map(function(h) {
                if (h.id !== habitId) return h;
                var existing = h.logs.indexOf(dateStr) !== -1;
                if (existing) {
                  setUndoData({ habitId: habitId, dateStr: dateStr, action: "remove" });
                  return Object.assign({}, h, { logs: h.logs.filter(function(d) { return d !== dateStr; }) });
                }
                var isLocked = h.logs.some(function(logDate) {
                  var diff = daysBetween(logDate, dateStr);
                  return diff > 0 && diff < h.cooldown;

              });

            setHabits(function(prev) {

                if (undoData.action === "add") {
                  return Object.assign({}, h, { logs: h.logs.filter(function(d) { return d !== undoData.dateStr; }) });
                } else {
                  return Object.assign({}, h, { logs: h.logs.concat([undoData.dateStr]).sort() });
                }
              });
            });
            setUndoData(null);
            setToast("되돌렸습니다");
          };

          var getLockedDates = function(habit) {
            var locked = {};
            habit.logs.forEach(function(logDate) {
              for (var i = 1; i < habit.cooldown; i++) {
                var d = parseDate(logDate);
                d.setDate(d.getDate() + i);
                locked[formatDate(d.getFullYear(), d.getMonth(), d.getDate())] = true;
              }
            });
            return locked;
          };

          var getNextAvailable = function(habit) {
            if (habit.logs.length === 0) return null;
            var lastLog = habit.logs[habit.logs.length - 1];
            var d = parseDate(lastLog);
            d.setDate(d.getDate() + habit.cooldown);
            return formatDate(d.getFullYear(), d.getMonth(), d.getDate());
          };

          var prevMonth = function() {

          };

          var nextMonth = function() {
            if (currentMonth === 11) { setCurrentMonth(0); setCurrentYear(function(y) { return y + 1; }); }
            else setCurrentMonth(function(m) { return m + 1; });
          };

          var goToday = function() {

            setCurrentYear(new Date().getFullYear());
          };

            var cellContent = null;
            var cellBg = "rgba(255,255,255,0.01)";

            if (activeHabit) {

              if (isLogged) {
                cellBg = activeColor.bg;

            e('div', { style: S.calendarGrid }, gridCells)
          );

          // === HABIT CARDS ===
          var habitsList = activeHabit ? [activeHabit] : habits;
          var cardsEls = habitsList.map(function(h) {
            var c = COLORS[h.color];
            var nextDate = getNextAvailable(h);
            var isAvailable = !nextDate || daysBetween(todayStr, nextDate) <= 0;
            var daysLeft = nextDate ? Math.max(0, daysBetween(todayStr, nextDate)) : 0;
            var totalLogs = h.logs.length;
            var monthPrefix = currentYear + "-" + String(currentMonth + 1).padStart(2, "0");
            var thisMonthLogs = h.logs.filter(function(d) { return d.indexOf(monthPrefix) === 0; }).length;

            return e('div', { key: h.id, style: S.habitCard },
              e('div', { style: S.habitCardTop },
                e('div', { style: { display: "flex", alignItems: "center", gap: 12 } },
                  e('div', { style: Object.assign({}, S.cardIconBox, { background: c.light, border: "1px solid " + c.border }) }, h.icon),
                  e('div', null,
                    e('div', { style: { fontSize: 14, fontWeight: 600, color: "#ffffff" } }, h.name),
                    e('div', { style: { fontSize: 11, color: "rgba(255,255,255,0.3)", marginTop: 2 } }, h.cooldown + '일 간격 통제')
                  )
                ),
                e('div', { style: { display: "flex", gap: 4 } },
                  e('button', { onClick: function() { openEdit(h); }, style: { width: 28, height: 28, background: "transparent", border: "none", cursor: "pointer", fontSize: 12, opacity: 0.3 } }, '✏️'),
                  e('button', { onClick: function() { setConfirmDelete(h.id); }, style: { width: 28, height: 28, background: "transparent", border: "none", cursor: "pointer", fontSize: 12, opacity: 0.3 } }, '🗑️')
                )
              ),
              e('div', { style: S.statusRow },
                e('div', {
                  style: Object.assign({}, S.statusBadge, {
                    background: isAvailable ? "rgba(78,205,196,0.06)" : "rgba(255,107,107,0.06)",
                    color: isAvailable ? "#4ECDC4" : "#FF6B6B",
                    border: isAvailable ? "1px solid rgba(78,205,196,0.15)" : "1px solid rgba(255,107,107,0.15)"
                  })
                }, isAvailable ? '기록 가능' : '잠금 해제까지 ' + daysLeft + '일'),
                e('div', { style: { display: "flex", gap: 12 } },
                  e('div', { style: { display: "flex", alignItems: "center", gap: 4, fontSize: 12 } },
                    e('span', { style: { color: "rgba(255,255,255,0.25)", fontSize: 11 } }, '당월'),
                    e('span', { style: { color: c.text, fontWeight: 600 } }, thisMonthLogs)
                  ),
                  e('div', { style: { display: "flex", alignItems: "center", gap: 4, fontSize: 12 } },
                    e('span', { style: { color: "rgba(255,255,255,0.25)", fontSize: 11 } }, '누적'),
                    e('span', { style: { color: "rgba(255,255,255,0.7)", fontWeight: 600 } }, totalLogs)
                  )
                )
              ),
              !isAvailable ? e('div', { style: S.progressContainer },
                e('div', { style: { height: "100%", background: c.bg, width: ((h.cooldown - daysLeft) / h.cooldown * 100) + "%", transition: "width 0.4s ease" } })
              ) : null
            );
          });

          var cardsSection = e('div', { style: S.cardsSection },
            cardsEls,
            habits.length === 0 ? e('div', { style: { textAlign: "center", padding: "40px 20px" } },
              e('p', { style: { fontSize: 24, marginBottom: 8 } }, '⚡'),
              e('p', { style: { color: "rgba(255,255,255,0.3)", fontSize: 13 } }, '상단의 버튼을 눌러 통제 리스트를 개설하세요.')
            ) : null
          );

          // === ADD MODAL ===
          var addModalEl = showAddModal ? e('div', { style: S.overlay, onClick: function() { setShowAddModal(false); } },
            e('div', { style: S.modal, onClick: function(ev) { ev.stopPropagation(); } },
              e('h2', { style: S.modalTitle }, '새로운 통제 생성'),
              e('label', { style: S.label }, '상징 아이콘'),
              e('div', { style: S.iconGrid },
                ICONS.map(function(ic) {
                  return e('button', {
                    key: ic,
                    onClick: function() { setNewHabitIcon(ic); },
                    style: Object.assign({}, S.iconBtn, {
                      background: newHabitIcon === ic ? "rgba(255,255,255,0.08)" : "transparent",
                      border: newHabitIcon === ic ? "1px solid rgba(255,255,255,0.2)" : "1px solid rgba(255,255,255,0.03)"
                    })
                  }, ic);
                })
              ),
              e('label', { style: S.label }, '통제 대상 이름'),
              e('input', {
                value: newHabitName,
                onChange: function(ev) { setNewHabitName(ev.target.value); },
                placeholder: "예: 음주, 야식, 모바일 게임",
                style: S.input,
                onKeyDown: function(ev) { if (ev.key === "Enter") addHabit(); }
              }),
              e('label', { style: S.label }, '필수 쿨다운 간격 설정'),
              e('div', { style: S.daysSelector },
                COOLDOWN_OPTIONS.map(function(d) {
                  return e('button', {
                    key: d,
                    onClick: function() { setNewHabitDays(d); },
                    style: Object.assign({}, S.dayOption, {
                      background: newHabitDays === d ? "rgba(255,255,255,0.08)" : "transparent",
                      border: newHabitDays === d ? "1px solid rgba(255,255,255,0.2)" : "1px solid rgba(255,255,255,0.03)",
                      color: newHabitDays === d ? "#ffffff" : "rgba(255,255,255,0.4)"
                    })
                  }, d + '일');
                })
              ),
              e('div', { style: S.modalActions },
                e('button', { onClick: function() { setShowAddModal(false); }, style: S.cancelBtn }, '이전'),
                e('button', { onClick: addHabit, style: Object.assign({}, S.confirmBtn, { opacity: newHabitName.trim() ? 1 : 0.3 }) }, '생성하기')
              )
            )
          ) : null;

          // === EDIT MODAL ===
          var editModalEl = showEditModal ? e('div', { style: S.overlay, onClick: function() { setShowEditModal(null); } },
            e('div', { style: S.modal, onClick: function(ev) { ev.stopPropagation(); } },
              e('h2', { style: S.modalTitle }, '통제 설정 수정'),
              e('label', { style: S.label }, '아이콘 교체'),
              e('div', { style: S.iconGrid },
                ICONS.map(function(ic) {
                  return e('button', {
                    key: ic,
                    onClick: function() { setEditIcon(ic); },
                    style: Object.assign({}, S.iconBtn, {
                      background: editIcon === ic ? "rgba(255,255,255,0.08)" : "transparent",
                      border: editIcon === ic ? "1px solid rgba(255,255,255,0.2)" : "1px solid rgba(255,255,255,0.03)"
                    })
                  }, ic);
                })
              ),
              e('label', { style: S.label }, '이름 수정'),
              e('input', { value: editName, onChange: function(ev) { setEditName(ev.target.value); }, style: S.input, onKeyDown: function(ev) { if (ev.key === "Enter") saveEdit(); } }),
              e('label', { style: S.label }, '쿨다운 재지정'),
              e('div', { style: S.daysSelector },
                COOLDOWN_OPTIONS.map(function(d) {
                  return e('button', {
                    key: d,
                    onClick: function() { setEditDays(d); },
                    style: Object.assign({}, S.dayOption, {
                      background: editDays === d ? "rgba(255,255,255,0.08)" : "transparent",
                      border: editDays === d ? "1px solid rgba(255,255,255,0.2)" : "1px solid rgba(255,255,255,0.03)",
                      color: editDays === d ? "#ffffff" : "rgba(255,255,255,0.4)"
                    })
                  }, d + '일');
                })
              ),
              e('div', { style: S.modalActions },
                e('button', { onClick: function() { setShowEditModal(null); }, style: S.cancelBtn }, '취소'),
                e('button', { onClick: saveEdit, style: S.confirmBtn }, '적용')
              )
            )
          ) : null;

          // === DELETE CONFIRM ===
          var deleteModalEl = confirmDelete ? e('div', { style: S.overlay, onClick: function() { setConfirmDelete(null); } },
            e('div', { style: Object.assign({}, S.modal, { maxWidth: 300, textAlign: "center" }), onClick: function(ev) { ev.stopPropagation(); } },
              e('p', { style: { color: "#ffffff", fontSize: 14, fontWeight: 500, marginBottom: 8 } }, '정말 삭제하시겠습니까?'),
              e('p', { style: { color: "rgba(255,255,255,0.3)", fontSize: 12, marginBottom: 24 } }, '모든 기록이 함께 삭제됩니다.'),
              e('div', { style: S.modalActions },
                e('button', { onClick: function() { setConfirmDelete(null); }, style: S.cancelBtn }, '취소'),
                e('button', { onClick: function() { deleteHabit(confirmDelete); }, style: Object.assign({}, S.confirmBtn, { background: "#E15252", color: "#ffffff" }) }, '삭제')
              )
            )
          ) : null;

          var toastEl = toast ? e('div', { style: S.toast }, toast) : null;
          var undoEl = undoData ? e('div', { style: S.undoBar },
            e('span', null, '기록이 변경되었습니다'),
            e('button', { onClick: handleUndo, style: S.undoBtn }, '되돌리기')
          ) : null;

          // === GLOBAL STYLE ===
          var styleEl = e('style', null,
            "@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');" +
            "* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }" +
            "body { font-family: 'Inter', 'Noto Sans KR', sans-serif; }" +
            "::-webkit-scrollbar { display: none; }"
          );

          return e('div', { style: S.container },
            styleEl,
            headerEl,
            bulletsEl,
            calendarEl,
            cardsSection,
            addModalEl,
            editModalEl,
            deleteModalEl,
            toastEl,
            undoEl
          );
        }

        var root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(HabitLockApp));
    };
    </script>
</body>
</html>
