<style>
    /* [디자인 시스템 변수 - 화사하고 깨끗한 톤] */
    :root {
        --bg-page: #f8fafc;         /* 화사하고 투명한 배경 */
        --bg-card: #ffffff;         /* 순백색 카드 배경 */
        --text-main: #0f172a;       /* 가독성 높은 차콜 블랙 */
        --text-sub: #64748b;        /* 감각적인 슬레이트 그레이 */
        --primary-blue: #3b82f6;    /* 세련된 구글 시그니처 블루 */
        --primary-hover: #2563eb;
        --danger-red: #ef4444;      /* 경고 및 포기 버튼용 레드 */
        --danger-hover: #dc2626;
        --border-color: #e2e8f0;    /* 연하고 깔끔한 테두리 */
        
        /* 달력용 세련된 파스텔 색감 */
        --cal-today: #eff6ff;       /* 오늘 날짜 강조 배경 */
        --cal-success: #dcfce7;     /* 성공한 날 은은한 초록 */
        --cal-success-text: #166534;
    }

    /* 기본 초기화 */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Noto Sans KR', sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-page);
        color: var(--text-main);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 40px 20px;
    }

    /* 1. 메인 레이아웃 및 카드 구조 스타일링 (기존 div 구조 그대로 유지) */
    body > div:not([id$="Modal"]), 
    div[id$="Modal"] > div {
        background-color: var(--bg-card);
        border-radius: 24px;
        padding: 40px 30px;
        width: 100%;
        max-width: 440px;
        text-align: center;
        box-shadow: 0 16px 36px rgba(148, 163, 184, 0.08);
        border: 1px solid rgba(226, 232, 240, 0.8);
        margin-bottom: 24px; /* 요소 간 간격 */
    }

    /* 타이틀 및 텍스트 */
    h1, h2, h3 {
        color: var(--text-main);
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
    }
    
    h1 { font-size: 1.8rem; }
    h2 { font-size: 1.4rem; }

    p {
        font-size: 0.95rem;
        color: var(--text-sub);
        margin-bottom: 24px;
        line-height: 1.5;
    }

    /* 2. 메인 타이머 디스플레이 */
    #timerDisplay {
        font-family: 'system-ui', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 4.5rem;
        font-weight: 700;
        color: var(--primary-blue);
        margin: 24px 0 32px 0;
        letter-spacing: -1px;
    }

    /* 3. 입력 폼 컴포넌트 */
    label {
        display: block;
        text-align: left;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 6px;
    }

    input[type="text"], select {
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 20px;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        background-color: #f1f5f9;
        color: var(--text-main);
        font-size: 0.95rem;
        transition: all 0.2s ease;
    }

    input[type="text"]:focus, select:focus {
        outline: none;
        border-color: var(--primary-blue);
        background-color: #ffffff;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    /* 4. 버튼 스타일 (구조 변형 없이 색감과 정돈감만 부여) */
    button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        margin-bottom: 12px;
    }

    button:active {
        transform: scale(0.98);
    }

    #openSettingsBtn, #startTimerBtn {
        background-color: var(--primary-blue);
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(59, 130, 246, 0.15);
        margin-bottom: 0;
    }

    #openSettingsBtn:hover, #startTimerBtn:hover {
        background-color: var(--primary-hover);
    }

    #closeSettingsBtn, #closeConfirmBtn {
        background-color: #f1f5f9;
        color: var(--text-sub);
        margin-top: 12px;
        margin-bottom: 0;
    }

    #closeSettingsBtn:hover, #closeConfirmBtn:hover {
        background-color: #e2e8f0;
        color: var(--text-main);
    }

    #giveUpBtn, #finalGiveUpBtn {
        background-color: var(--danger-red);
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(239, 68, 68, 0.1);
        margin-bottom: 0;
    }

    #giveUpBtn:hover, #finalGiveUpBtn:hover {
        background-color: var(--danger-hover);
    }

    #penaltyConfirmText {
        display: inline-block;
        font-weight: 700;
        color: var(--danger-red);
        background-color: #fef2f2;
        padding: 4px 10px;
        border-radius: 8px;
        margin-top: 6px;
    }

    /* 5. 불릿 리스트(스트릭/기록 영역) 디자인 */
    ul, ol {
        text-align: left;
        padding-left: 20px;
        margin: 16px 0;
        color: var(--text-main);
    }

    li {
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 8px;
        color: var(--text-sub);
    }
    
    li strong, li span {
        color: var(--text-main);
    }

    /* 6. 달력(Calendar) 색감 및 컴팩트 디자인 */
    /* 기존 테이블이나 그리드 구조의 뼈대는 건드리지 않고 색상과 둥글기만 고급스럽게 조절합니다. */
    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 6px;
        margin-top: 16px;
    }

    th {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-sub);
        padding-bottom: 8px;
        text-transform: uppercase;
    }

    td {
        width: 40px;
        height: 40px;
        font-size: 0.9rem;
        font-weight: 600;
        border-radius: 10px;
        transition: all 0.2s ease;
        color: var(--text-main);
        background-color: #f8fafc; /* 기본 날짜 배경 */
        vertical-align: middle;
    }

    /* 달력 안의 특수 상태 클래스 대응 (예시 명칭 기반 스타일링) */
    td.today, td[class*="today"] {
        background-color: var(--cal-today) !important;
        color: var(--primary-blue) !important;
        box-shadow: inset 0 0 0 2px var(--primary-blue);
    }

    td.success, td[class*="success"], td.completed {
        background-color: var(--cal-success) !important;
        color: var(--cal-success-text) !important;
    }
    
    td.empty, td:empty {
        background-color: transparent;
    }

    /* 7. 모달 오버레이 (JS 호환성 100%) */
    div[id$="Modal"] {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(15, 23, 42, 0.15);
        backdrop-filter: blur(4px);
        display: none; /* JS 제어용 */
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 20px;
    }

    div[id$="Modal"] > div {
        text-align: left;
        margin-bottom: 0;
        animation: modalPop 0.2s ease-out;
    }

    @keyframes modalPop {
        from { transform: scale(0.97); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
</style>
