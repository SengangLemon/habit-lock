<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Lock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS만 화사하고 심플하게 전면 수정 */
        :root {
            --bg-main: #f8fafc;        /* 화사한 메인 배경 */
            --bg-card: #ffffff;        /* 깔끔한 화이트 카드 */
            --text-main: #1e293b;      /* 깊이감 있는 차콜 (가독성) */
            --text-sub: #64748b;       /* 부드러운 슬레이트 그레이 */
            --accent-blue: #3b82f6;    /* 신뢰감을 주는 구글 블루 */
            --accent-hover: #2563eb;
            --danger-red: #ef4444;     /* 경고용 레드 */
            --danger-hover: #dc2626;
            --border-light: #e2e8f0;   /* 연한 구분선 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', 'Montserrat', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 원래 있던 태그 스타일링 */
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* 입력 폼 요소 */
        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            margin-top: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            background-color: #f1f5f9;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent-blue);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* 버튼 기본 정의 */
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        /* 원본 ID 기반 스타일 매핑 (구조 절대 유지) */
        #timerDisplay {
            font-family: 'Montserrat', sans-serif;
            font-size: 4.5rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin: 30px 0;
            letter-spacing: -1px;
        }

        #openSettingsBtn, #startTimerBtn {
            background-color: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        #openSettingsBtn:hover, #startTimerBtn:hover {
            background-color: var(--accent-hover);
        }

        #closeSettingsBtn, #closeConfirmBtn {
            background-color: #f1f5f9;
            color: var(--text-sub);
            margin-top: 8px; /* 버튼 사이 여백 */
        }

        #closeSettingsBtn:hover, #closeConfirmBtn:hover {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        #giveUpBtn, #finalGiveUpBtn {
            background-color: var(--danger-red);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);
        }

        #giveUpBtn:hover, #finalGiveUpBtn:hover {
            background-color: var(--danger-hover);
        }

        #penaltyConfirmText {
            display: inline-block;
            font-weight: 700;
            color: var(--danger-red);
            background-color: #fef2f2;
            padding: 4px 8px;
            border-radius: 6px;
            margin-top: 5px;
        }

        /* 모달 레이아웃 기본 정의 */
        div[id$="Modal"] {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.3); /* 화사한 배경에 맞춘 투명도 */
            backdrop-filter: blur(4px);
            display: none; /* 기본 숨김 */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* 메인 컨테이너 및 모달 내부 백그라운드 공통 (원래 div들) */
        body > div:not([id$="Modal"]), div[id$="Modal"] > div {
            background-color: var(--bg-card);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(148, 163, 184, 0.15);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* 모달이 열렸을 때 자바스크립트가 display를 다룰 수 있도록 지원 */
        div[id$="Modal"] > div {
            text-align: left; /* 모달 내부는 정렬을 깔끔하게 */
            animation: popUp 0.25s ease-out;
        }

        @keyframes popUp {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div>
        <h1>Habit Lock</h1>
        <p>나쁜 습관을 잠그고 시간에 몰입하세요</p>
        
        <div id="timerDisplay">25:00</div>
        
        <button id="openSettingsBtn">습관 잠금 시작하기</button>
        <button id="giveUpBtn" style="display: none;">포기하기</button>
    </div>

    <div id="settingsModal">
        <div>
            <h1>습관 잠금 설정</h1>
            <p>포기할 때 치를 대가와 제한 시간을 설정해 주세요.</p>
            
            <label>나쁜 습관 (또는 벌칙)</label>
            <input type="text" id="penaltyInput" placeholder="예: 유튜브 쇼츠 보기, 꿀밤 대가">
            
            <label>제한 시간</label>
            <select id="timeSelect">
                <option value="10">10분</option>
                <option value="25" selected>25분</option>
                <option value="50">50분</option>
                <option value="60">1시간</option>
            </select>
            
            <button id="startTimerBtn">잠금 시작</button>
            <button id="closeSettingsBtn">취소</button>
        </div>
    </div>

    <div id="confirmModal">
        <div>
            <h1>정말 포기하시겠습니까?</h1>
            <p>지금 포기하시면 설정하신 대가를 치러야 합니다:<br>
               <span id="penaltyConfirmText"></span>
            </p>
            <button id="finalGiveUpBtn">포기하기</button>
            <button id="closeConfirmBtn">계속 진행</button>
        </div>
    </div>

    <script>
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const startTimerBtn = document.getElementById('startTimerBtn');
        const giveUpBtn = document.getElementById('giveUpBtn');
        const closeConfirmBtn = document.getElementById('closeConfirmBtn');
        const finalGiveUpBtn = document.getElementById('finalGiveUpBtn');

        const settingsModal = document.getElementById('settingsModal');
        const confirmModal = document.getElementById('confirmModal');
        
        const timerDisplay = document.getElementById('timerDisplay');
        const penaltyInput = document.getElementById('penaltyInput');
        const timeSelect = document.getElementById('timeSelect');
        const penaltyConfirmText = document.getElementById('penaltyConfirmText');

        let countdown;
        let timeLeft;
        let isRunning = false;

        // 설정창 열기
        openSettingsBtn.addEventListener('click', () => {
            settingsModal.style.display = 'flex';
        });

        // 설정창 닫기
        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        // 타이머 시작
        startTimerBtn.addEventListener('click', () => {
            const minutes = parseInt(timeSelect.value);
            timeLeft = minutes * 60;
            updateDisplay(timeLeft);
            settingsModal.style.display = 'none';
            
            openSettingsBtn.style.display = 'none';
            giveUpBtn.style.display = 'block';
            
            startTimer();
        });

        // 포기 확인창 열기
        giveUpBtn.addEventListener('click', () => {
            penaltyConfirmText.textContent = penaltyInput.value || "설정된 대가가 없습니다.";
            confirmModal.style.display = 'flex';
        });

        // 포기 취소 (계속 진행)
        closeConfirmBtn.addEventListener('click', () => {
            confirmModal.style.display = 'none';
        });

        // 최종 포기
        finalGiveUpBtn.addEventListener('click', () => {
            clearInterval(countdown);
            isRunning = false;
            timerDisplay.textContent = "25:00";
            
            confirmModal.style.display = 'none';
            openSettingsBtn.style.display = 'block';
            giveUpBtn.style.display = 'none';
        });

        function startTimer() {
            if (isRunning) return;
            isRunning = true;

            countdown = setInterval(() => {
                timeLeft--;
                updateDisplay(timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    isRunning = false;
                    alert("성공했습니다! 나쁜 습관을 이겨내셨군요.");
                    openSettingsBtn.style.display = 'block';
                    giveUpBtn.style.display = 'none';
                }
            }, 1000);
        }

        function updateDisplay(seconds) {
            const min = String(Math.floor(seconds / 60)).padStart(2, '0');
            const sec = String(seconds % 60).padStart(2, '0');
            timerDisplay.textContent = `${min}:${sec}`;
        }
    </script>
</body>
</html>
