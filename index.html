<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Lock</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 모바일 앱 느낌을 주기 위한 부드러운 기본 배경 스타일 */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        #root {
            width: 100%;
            max-width: 480px; /* 모바일 가로 너비 제한 */
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        // 브라우저 환경에서 React Hook을 편하게 쓰기 위한 선언
        const { useState, useEffect, useRef } = React;

        // ----------------------------------------------------
        // 본인이 작성한 habit-lock.jsx의 코드 내용을 
        // 아래 App 컴포넌트 내부에 복사해서 넣으시면 됩니다.
        // ----------------------------------------------------
        function App() {
            // 예시용 상태(State)와 로직입니다. 본인 코드로 대체하세요!
            const [count, setCount] = useState(0);

            return (
                <div style={{ padding: '20px', textAlign: 'center' }}>
                    <h1 style={{ fontSize: '24px', marginTop: '40px', color: '#1d1d1f' }}>🔒 Habit Lock</h1>
                    <p style={{ color: '#86868b', marginBottom: '30px' }}>나만의 습관 관리 앱</p>
                    
                    <div style={{ 
                        background: '#f5f5f7', 
                        padding: '20px', 
                        borderRadius: '12px',
                        marginBottom: '20px' 
                    }}>
                        <p style={{ fontSize: '18px', fontWeight: 'bold' }}>오늘의 실천 횟수</p>
                        <p style={{ fontSize: '32px', color: '#0071e3', margin: '10px 0' }}>{count}회</p>
                    </div>

                    <button 
                        onClick={() => setCount(count + 1)}
                        style={{
                            background: '#0071e3',
                            color: 'white',
                            border: 'none',
                            padding: '12px 24px',
                            borderRadius: '8px',
                            fontSize: '16px',
                            fontWeight: '600',
                            cursor: 'pointer',
                            width: '100%'
                        }}
                    >
                        성공 체크하기
                    </button>
                </div>
            );
        }

        // 화면에 최종 렌더링을 수행하는 코드
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
