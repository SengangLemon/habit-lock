<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Habit Lock</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#F5F6F8;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;display:flex;justify-content:center;min-height:100vh}
#root{width:100%;max-width:480px;min-height:100vh}
::-webkit-scrollbar{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes toast{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div id="root"></div>
<script>
window.onload=function(){
if(typeof React==='undefined'){document.getElementById('root').innerHTML='<p style="text-align:center;padding:60px 20px;color:#999">React CDN 로딩 실패</p>';return}
var h=React.createElement,us=React.useState,ue=React.useEffect;

var PAL=[
  {bg:"#3182F6",l:"#EBF4FF",b:"#B8D4FA",t:"#3182F6",dot:"#3182F6"},
  {bg:"#F04452",l:"#FFF0F1",b:"#F9BCC2",t:"#F04452",dot:"#F04452"},
  {bg:"#00B386",l:"#E6F9F3",b:"#99DFC9",t:"#00B386",dot:"#00B386"},
  {bg:"#8B5CF6",l:"#F3EEFF",b:"#C9B5FB",t:"#8B5CF6",dot:"#8B5CF6"},
  {bg:"#F97316",l:"#FFF4EB",b:"#FDCA9A",t:"#F97316",dot:"#F97316"},
  {bg:"#EC4899",l:"#FEF0F7",b:"#F6A9D0",t:"#EC4899",dot:"#EC4899"},
  {bg:"#0EA5E9",l:"#EBF8FF",b:"#94D5F3",t:"#0EA5E9",dot:"#0EA5E9"},
  {bg:"#84CC16",l:"#F3FCE4",b:"#C4E88D",t:"#5F9913",dot:"#84CC16"}
];
var DAYS_KR=["일","월","화","수","목","금","토"];
var CD_OPTS=[1,2,3,4,5,7,10,14,30];

function fmt(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function prs(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function diff(a,b){return Math.floor((prs(b)-prs(a))/864e5)}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function fdow(y,m){return new Date(y,m,1).getDay()}

function App(){
  var _h=us([]),habits=_h[0],setHabits=_h[1];
  var _cm=us(new Date().getMonth()),cM=_cm[0],setCM=_cm[1];
  var _cy=us(new Date().getFullYear()),cY=_cy[0],setCY=_cy[1];
  var _sel=us(null),sel=_sel[0],setSel=_sel[1];
  var _add=us(false),showAdd=_add[0],setShowAdd=_add[1];
  var _nn=us(""),nn=_nn[0],setNN=_nn[1];
  var _nd=us(4),nd=_nd[0],setND=_nd[1];
  var _nt=us("bad"),nt=_nt[0],setNT=_nt[1]; // "bad" or "good"
  var _ld=us(false),loaded=_ld[0],setLoaded=_ld[1];
  var _tt=us(null),toast=_tt[0],setToast=_tt[1];
  var _del=us(null),delId=_del[0],setDelId=_del[1];
  var _edit=us(null),editId=_edit[0],setEditId=_edit[1];
  var _en=us(""),en=_en[0],setEN=_en[1];
  var _ed=us(4),ed=_ed[0],setED=_ed[1];
  var _et=us("bad"),et=_et[0],setET=_et[1];
  var _tab=us("all"),tab=_tab[0],setTab=_tab[1]; // "all","bad","good"

  ue(function(){try{var d=localStorage.getItem("hl3");if(d)setHabits(JSON.parse(d))}catch(e){}setLoaded(true)},[]);
  ue(function(){if(loaded)try{localStorage.setItem("hl3",JSON.stringify(habits))}catch(e){}},[habits,loaded]);
  ue(function(){if(toast){var t=setTimeout(function(){setToast(null)},2200);return function(){clearTimeout(t)}}},[toast]);

  var now=new Date(),todayStr=fmt(now.getFullYear(),now.getMonth(),now.getDate());

  function addHabit(){
    if(!nn.trim())return;
    setHabits(function(p){return p.concat([{id:Date.now()+"",name:nn.trim(),cd:nd,type:nt,ci:p.length%PAL.length,logs:[]}])});
    setNN("");setND(4);setNT("bad");setShowAdd(false);setToast("추가되었어요")
  }
  function delHabit(id){setHabits(function(p){return p.filter(function(x){return x.id!==id})});if(sel===id)setSel(null);setDelId(null);setToast("삭제했어요")}
  function toggleLog(hid,ds){
    setHabits(function(p){return p.map(function(x){
      if(x.id!==hid)return x;
      if(x.logs.indexOf(ds)!==-1)return Object.assign({},x,{logs:x.logs.filter(function(d){return d!==ds})});
      // Bad habit: check lock
      if(x.type==="bad"){
        var locked=x.logs.some(function(ld){var df=diff(ld,ds);return df>0&&df<x.cd});
        if(locked){setToast("쿨다운 중이에요");return x}
      }
      return Object.assign({},x,{logs:x.logs.concat([ds]).sort()})
    })})
  }
  function getLocked(hab){var lk={};if(hab.type!=="bad")return lk;hab.logs.forEach(function(ld){for(var i=1;i<hab.cd;i++){var d=prs(ld);d.setDate(d.getDate()+i);lk[fmt(d.getFullYear(),d.getMonth(),d.getDate())]=true}});return lk}
  function getNext(hab){if(!hab.logs.length||hab.type!=="bad")return null;var last=hab.logs[hab.logs.length-1];var d=prs(last);d.setDate(d.getDate()+hab.cd);return fmt(d.getFullYear(),d.getMonth(),d.getDate())}
  function getStreak(hab){if(hab.type!=="good"||!hab.logs.length)return 0;var streak=0;var d=new Date();for(var i=0;i<365;i++){var ds=fmt(d.getFullYear(),d.getMonth(),d.getDate());if(hab.logs.indexOf(ds)!==-1)streak++;else if(i>0)break;d.setDate(d.getDate()-1)}return streak}
  function getMissed(hab){if(hab.type!=="good")return 0;var d=new Date();var missed=0;for(var i=1;i<=hab.cd;i++){var dd=new Date(d);dd.setDate(dd.getDate()-i);var ds=fmt(dd.getFullYear(),dd.getMonth(),dd.getDate());if(hab.logs.indexOf(ds)===-1)missed++}return missed}
  function prevM(){if(cM===0){setCM(11);setCY(function(y){return y-1})}else setCM(function(m){return m-1})}
  function nextM(){if(cM===11){setCM(0);setCY(function(y){return y+1})}else setCM(function(m){return m+1})}
  function goToday(){setCM(now.getMonth());setCY(now.getFullYear())}
  function saveEdit(){if(!en.trim()||!editId)return;setHabits(function(p){return p.map(function(x){return x.id!==editId?x:Object.assign({},x,{name:en.trim(),cd:ed,type:et})})});setEditId(null);setToast("수정했어요")}
  function openEdit(hab){setEN(hab.name);setED(hab.cd);setET(hab.type||"bad");setEditId(hab.id)}

  var dinm=dim(cY,cM),fd=fdow(cY,cM);
  var filteredHabits=habits.filter(function(x){return tab==="all"||x.type===tab});
  var aH=habits.find(function(x){return x.id===sel})||null;
  var aLk=aH?getLocked(aH):{};
  var aC=aH?PAL[aH.ci]:null;
  var allD=sel?[]:filteredHabits.map(function(x){return Object.assign({},x,{lk:getLocked(x),c:PAL[x.ci]})});

  var cells=[];for(var i=0;i<fd;i++)cells.push(null);for(var d=1;d<=dinm;d++)cells.push(d);while(cells.length%7)cells.push(null);

  var white="#FFF",g1="#191F28",g2="#333D4B",g3="#6B7684",g4="#8B95A1",g5="#B0B8C1",g7="#E5E8EB",g8="#F2F4F6",g9="#F7F8FA";

  // Header
  var header=h('div',{style:{padding:"48px 24px 8px",display:"flex",justifyContent:"space-between",alignItems:"center"}},
    h('div',null,
      h('div',{style:{fontSize:21,fontWeight:700,color:g1,letterSpacing:"-.5px"}},"Habit Lock"),
      h('div',{style:{fontSize:13,color:g4,marginTop:2}},"습관을 기록하고 관리하세요")
    ),
    h('button',{onClick:function(){setShowAdd(true)},style:{width:38,height:38,borderRadius:19,background:white,border:"1px solid "+g7,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",boxShadow:"0 1px 3px rgba(0,0,0,.04)",fontSize:18,color:g2,lineHeight:1,fontFamily:"inherit"}},"＋")
  );

  // Tabs
  var tabs=h('div',{style:{padding:"12px 24px 6px",display:"flex",gap:6}},
    ["all","bad","good"].map(function(t){
      var label=t==="all"?"전체":t==="bad"?"절제":"실천";
      var isA=tab===t;
      return h('button',{key:t,onClick:function(){setTab(t);setSel(null)},style:{
        padding:"7px 16px",borderRadius:20,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit",
        background:isA?g1:white,color:isA?white:g3,
        boxShadow:isA?"0 2px 8px rgba(25,31,40,.12)":"0 1px 2px rgba(0,0,0,.04)",transition:"all .2s"
      }},label)
    })
  );

  // Bullets
  var bullets=h('div',{style:{padding:"8px 24px 14px",overflowX:"auto"}},
    h('div',{style:{display:"flex",gap:7}},
      filteredHabits.map(function(x){
        var c=PAL[x.ci],isA=sel===x.id;
        var isBad=x.type==="bad";
        var nx=getNext(x),avail=!nx||diff(todayStr,nx)<=0;
        return h('button',{key:x.id,onClick:function(){setSel(isA?null:x.id)},style:{
          display:"flex",alignItems:"center",gap:7,padding:"7px 14px",borderRadius:22,border:"none",cursor:"pointer",whiteSpace:"nowrap",fontSize:13,fontWeight:600,fontFamily:"inherit",
          background:isA?c.l:white,color:isA?c.t:g3,
          boxShadow:isA?"0 2px 8px "+c.b+"66":"0 1px 2px rgba(0,0,0,.04)",transition:"all .2s"
        }},
          // Bullet dot instead of emoji
          h('span',{style:{width:8,height:8,borderRadius:4,background:c.dot,flexShrink:0,opacity:isA?1:.6}}),
          x.name,
          // Status indicator
          isBad&&!avail?h('span',{style:{width:5,height:5,borderRadius:3,background:c.bg,marginLeft:2}}):null,
          !isBad?h('span',{style:{fontSize:10,color:c.t,marginLeft:2,opacity:.6}},getStreak(x)>0?getStreak(x)+"d":""):null
        )
      })
    )
  );

  // Calendar
  var calNav=h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18,padding:"0 4px"}},
    h('button',{onClick:prevM,style:{width:34,height:34,borderRadius:17,background:"transparent",border:"none",color:g4,fontSize:18,cursor:"pointer",fontFamily:"inherit"}},"‹"),
    h('button',{onClick:goToday,style:{fontSize:15,fontWeight:700,color:g1,background:"none",border:"none",cursor:"pointer",fontFamily:"inherit"}},cY+"년 "+(cM+1)+"월"),
    h('button',{onClick:nextM,style:{width:34,height:34,borderRadius:17,background:"transparent",border:"none",color:g4,fontSize:18,cursor:"pointer",fontFamily:"inherit"}},"›")
  );

  var calHeaders=h('div',{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:6}},
    DAYS_KR.map(function(d,i){return h('div',{key:d,style:{textAlign:"center",fontSize:11,fontWeight:600,color:i===0?"#F04452":i===6?"#3182F6":g5,padding:"3px 0"}},d)})
  );

  var calGrid=h('div',{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}},
    cells.map(function(day,idx){
      if(day===null)return h('div',{key:"e"+idx,style:{aspectRatio:"1"}});
      var ds=fmt(cY,cM,day),isT=ds===todayStr,dow=(fd+day-1)%7;
      var content=null,bg="transparent",border="none";

      if(aH){
        var logged=aH.logs.indexOf(ds)!==-1,locked=!!aLk[ds];
        var isBad=aH.type==="bad";
        if(logged){
          bg=aC.bg;
          // Simple bullet check mark
          content=h('span',{style:{width:6,height:6,borderRadius:3,background:"#fff"}})
        }else if(locked&&isBad){
          bg=aC.l;border="1.5px dashed "+aC.b;
          content=h('span',{style:{fontSize:8,color:aC.b,fontWeight:700}},"×")
        }
      }else{
        var dots=allD.filter(function(x){return x.logs.indexOf(ds)!==-1});
        var locks=allD.filter(function(x){return x.logs.indexOf(ds)===-1&&x.lk[ds]});
        if(dots.length>0)content=h('div',{style:{display:"flex",gap:2,justifyContent:"center",flexWrap:"wrap"}},dots.slice(0,4).map(function(x){return h('span',{key:x.id,style:{width:4,height:4,borderRadius:2,background:x.c.dot}})}));
        else if(locks.length>0)content=h('div',{style:{display:"flex",gap:2,justifyContent:"center"}},locks.slice(0,3).map(function(x){return h('span',{key:x.id,style:{width:4,height:4,borderRadius:2,background:x.c.b,opacity:.5}})}));
      }

      var txtC=content&&aH&&aH.logs.indexOf(ds)!==-1?"#FFF":isT?g1:dow===0?"#F04452":dow===6?"#3182F6":g2;
      return h('button',{key:day,onClick:function(){if(aH)toggleLog(aH.id,ds)},style:{
        aspectRatio:"1",borderRadius:14,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
        background:bg,border:border,cursor:aH?"pointer":"default",position:"relative",fontFamily:"inherit",gap:2,transition:"all .15s"
      }},
        h('span',{style:{fontSize:11.5,fontWeight:isT?700:500,color:txtC}},day),
        content?h('div',{style:{lineHeight:1}},content):null,
        isT&&!content?h('div',{style:{position:"absolute",bottom:5,width:4,height:4,borderRadius:2,background:"#3182F6"}}):null
      )
    })
  );

  var calendar=h('div',{style:{margin:"0 16px 14px",padding:18,background:white,borderRadius:22,boxShadow:"0 2px 10px rgba(0,0,0,.03)"}},calNav,calHeaders,calGrid);

  // Habit Cards
  var cardList=(aH?[aH]:filteredHabits).map(function(x){
    var c=PAL[x.ci],isBad=x.type==="bad";
    var nx=getNext(x),avail=!nx||diff(todayStr,nx)<=0;
    var left=nx?Math.max(0,diff(todayStr,nx)):0;
    var mp=cY+"-"+String(cM+1).padStart(2,"0");
    var mLogs=x.logs.filter(function(d){return d.indexOf(mp)===0}).length;
    var streak=getStreak(x);

    return h('div',{key:x.id,style:{padding:18,background:white,borderRadius:22,boxShadow:"0 2px 10px rgba(0,0,0,.03)",animation:"fadeUp .3s ease"}},
      h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
        h('div',{style:{display:"flex",alignItems:"center",gap:12}},
          // Colored bullet
          h('div',{style:{width:36,height:36,borderRadius:12,background:c.l,display:"flex",alignItems:"center",justifyContent:"center"}},
            h('span',{style:{width:12,height:12,borderRadius:6,background:c.dot}})
          ),
          h('div',null,
            h('div',{style:{fontSize:15,fontWeight:700,color:g1}},x.name),
            h('div',{style:{fontSize:12,color:g4,marginTop:2}},
              isBad?x.cd+"일 쿨다운":"매일 실천"+(x.cd>1?" · "+x.cd+"일 주기":"")
            )
          )
        ),
        h('div',{style:{display:"flex",gap:4}},
          // Type badge
          h('span',{style:{fontSize:10,padding:"3px 8px",borderRadius:8,background:isBad?"#FFF0F1":"#E6F9F3",color:isBad?"#F04452":"#00B386",fontWeight:600}},isBad?"절제":"실천"),
          h('button',{onClick:function(e){e.stopPropagation();openEdit(x)},style:{width:30,height:30,borderRadius:9,background:g8,border:"none",cursor:"pointer",fontSize:12}},"\u270F"),
          h('button',{onClick:function(e){e.stopPropagation();setDelId(x.id)},style:{width:30,height:30,borderRadius:9,background:g8,border:"none",cursor:"pointer",fontSize:12}},"\u2715")
        )
      ),
      // Status
      h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:14}},
        isBad?
          h('div',{style:{padding:"5px 14px",borderRadius:18,fontSize:13,fontWeight:600,background:avail?"#E6F9F3":"#FFF0F1",color:avail?"#00B386":"#F04452"}},avail?"가능":"D-"+left)
          :
          h('div',{style:{padding:"5px 14px",borderRadius:18,fontSize:13,fontWeight:600,background:streak>0?"#E6F9F3":"#FFF7ED",color:streak>0?"#00B386":"#F97316"}},streak>0?streak+"일 연속":"오늘 기록하세요"),
        h('div',{style:{display:"flex",gap:14}},
          h('div',{style:{textAlign:"center"}},
            h('div',{style:{fontSize:17,fontWeight:700,color:c.t}},mLogs),
            h('div',{style:{fontSize:11,color:g5}},"이번 달")
          ),
          h('div',{style:{textAlign:"center"}},
            h('div',{style:{fontSize:17,fontWeight:700,color:g2}},x.logs.length),
            h('div',{style:{fontSize:11,color:g5}},"누적")
          )
        )
      ),
      // Progress (bad) or streak bar (good)
      isBad&&!avail?h('div',{style:{marginTop:12,height:5,background:g8,borderRadius:3,overflow:"hidden"}},
        h('div',{style:{height:"100%",borderRadius:3,background:"linear-gradient(90deg,"+c.bg+","+c.b+")",width:((x.cd-left)/x.cd*100)+"%",transition:"width .4s"}})
      ):null,
      !isBad&&streak>0?h('div',{style:{marginTop:12,height:5,background:g8,borderRadius:3,overflow:"hidden"}},
        h('div',{style:{height:"100%",borderRadius:3,background:"linear-gradient(90deg,"+c.bg+","+c.b+")",width:Math.min(100,streak/30*100)+"%",transition:"width .4s"}})
      ):null
    )
  });

  var cards=h('div',{style:{padding:"0 16px 24px",display:"flex",flexDirection:"column",gap:10}},
    cardList,
    filteredHabits.length===0?h('div',{style:{textAlign:"center",padding:"48px 20px",animation:"fadeUp .4s"}},
      h('div',{style:{width:48,height:48,borderRadius:24,background:g8,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px"}},
        h('span',{style:{width:16,height:16,borderRadius:8,background:g5}})
      ),
      h('div',{style:{fontSize:15,fontWeight:600,color:g2,marginBottom:4}},"아직 등록된 습관이 없어요"),
      h('div',{style:{fontSize:13,color:g4}},"+ 버튼을 눌러 추가하세요")
    ):null
  );

  // Modal helpers
  function modal(content,onClose){
    return h('div',{onClick:onClose,style:{position:"fixed",inset:0,background:"rgba(0,0,0,.3)",backdropFilter:"blur(6px)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:100}},
      h('div',{onClick:function(e){e.stopPropagation()},style:{background:white,borderRadius:"26px 26px 0 0",padding:"28px 24px 36px",width:"100%",maxWidth:480,animation:"scaleIn .2s",maxHeight:"85vh",overflowY:"auto"}},content)
    )
  }
  function label(t){return h('div',{style:{fontSize:13,fontWeight:600,color:g3,marginBottom:8}},t)}
  function cdPicker(val,onSel){
    return h('div',{style:{display:"flex",flexWrap:"wrap",gap:7,marginBottom:24}},
      CD_OPTS.map(function(d){return h('button',{key:d,onClick:function(){onSel(d)},style:{
        padding:"7px 14px",borderRadius:12,fontSize:13,fontWeight:600,cursor:"pointer",border:"none",fontFamily:"inherit",
        background:val===d?g1:g8,color:val===d?white:g3,transition:"all .15s"
      }},d+"일")}))
  }
  function typePicker(val,onSel){
    return h('div',{style:{display:"flex",gap:8,marginBottom:24}},
      [{k:"bad",label:"절제",desc:"N일에 1번만 허용",col:"#F04452",bg:"#FFF0F1"},
       {k:"good",label:"실천",desc:"매일 체크, 연속기록",col:"#00B386",bg:"#E6F9F3"}
      ].map(function(o){
        var isA=val===o.k;
        return h('button',{key:o.k,onClick:function(){onSel(o.k)},style:{
          flex:1,padding:"14px 12px",borderRadius:14,border:isA?"2px solid "+o.col:"2px solid "+g7,background:isA?o.bg:white,
          cursor:"pointer",fontFamily:"inherit",textAlign:"left",transition:"all .15s"
        }},
          h('div',{style:{display:"flex",alignItems:"center",gap:6,marginBottom:4}},
            h('span',{style:{width:10,height:10,borderRadius:5,background:isA?o.col:g5}}),
            h('span',{style:{fontSize:14,fontWeight:700,color:isA?o.col:g3}},o.label)
          ),
          h('div',{style:{fontSize:11,color:g4}},o.desc)
        )
      })
    )
  }
  function inputF(val,onChange,ph,onEnter){
    return h('input',{value:val,onChange:function(e){onChange(e.target.value)},placeholder:ph,onKeyDown:function(e){if(e.key==="Enter"&&onEnter)onEnter()},style:{
      width:"100%",padding:"13px 16px",background:g9,border:"1.5px solid "+g7,borderRadius:14,color:g1,fontSize:14,outline:"none",marginBottom:22,fontFamily:"inherit"
    }})
  }
  function btns(cancelT,confirmT,onC,onOk,cBg,cCol,dis){
    return h('div',{style:{display:"flex",gap:10}},
      h('button',{onClick:onC,style:{flex:1,padding:13,borderRadius:14,background:g8,border:"none",color:g3,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}},cancelT),
      h('button',{onClick:onOk,style:{flex:1,padding:13,borderRadius:14,background:cBg||"#3182F6",border:"none",color:cCol||white,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit",opacity:dis?.4:1}},confirmT)
    )
  }

  var addModal=showAdd?modal(
    h('div',null,
      h('div',{style:{fontSize:19,fontWeight:700,color:g1,marginBottom:22}},"새 습관"),
      label("유형"),typePicker(nt,setNT),
      label("이름"),inputF(nn,setNN,nt==="bad"?"예: 음주, 야식, SNS...":"예: 운동, 독서, 명상...",addHabit),
      label(nt==="bad"?"쿨다운 (며칠에 1번)":"주기 (연속 기록 기준)"),cdPicker(nd,setND),
      btns("취소","추가하기",function(){setShowAdd(false)},addHabit,null,null,!nn.trim())
    ),function(){setShowAdd(false)}
  ):null;

  var editModal=editId?modal(
    h('div',null,
      h('div',{style:{fontSize:19,fontWeight:700,color:g1,marginBottom:22}},"습관 수정"),
      label("유형"),typePicker(et,setET),
      label("이름"),inputF(en,setEN,"",saveEdit),
      label("주기"),cdPicker(ed,setED),
      btns("취소","저장",function(){setEditId(null)},saveEdit)
    ),function(){setEditId(null)}
  ):null;

  var deleteModal=delId?modal(
    h('div',{style:{textAlign:"center"}},
      h('div',{style:{width:48,height:48,borderRadius:24,background:"#FFF0F1",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px"}},
        h('span',{style:{fontSize:16,color:"#F04452"}},"✕")
      ),
      h('div',{style:{fontSize:17,fontWeight:700,color:g1,marginBottom:6}},"정말 삭제할까요?"),
      h('div',{style:{fontSize:13,color:g4,marginBottom:24}},"모든 기록이 함께 사라져요"),
      btns("취소","삭제",function(){setDelId(null)},function(){delHabit(delId)},"#F04452",white)
    ),function(){setDelId(null)}
  ):null;

  var toastEl=toast?h('div',{style:{
    position:"fixed",bottom:32,left:"50%",transform:"translateX(-50%)",
    background:g1,color:white,padding:"11px 22px",borderRadius:18,fontSize:13,fontWeight:600,
    zIndex:200,boxShadow:"0 8px 28px rgba(0,0,0,.18)",whiteSpace:"nowrap",animation:"toast .2s"
  }},toast):null;

  return h('div',{style:{paddingBottom:40}},header,tabs,bullets,calendar,cards,addModal,editModal,deleteModal,toastEl)
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
};
</script>
