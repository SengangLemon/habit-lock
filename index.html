<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Lock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* [디자인 시스템 변수 선언] */
        :root {
            --bg-page: #f8fafc;         /* 화사하고 깨끗한 배경 */
            --bg-card: #ffffff;         /* 순백색 카드 배경 */
            --text-main: #0f172a;       /* 가독성 높은 차콜 블랙 */
            --text-sub: #64748b;        /* 감각적인 슬레이트 그레이 */
            --primary-blue: #3b82f6;    /* 세련된 구글 시그니처 블루 */
            --primary-hover: #2563eb;
            --danger-red: #ef4444;      /* 경고 및 포기 버튼용 레드 */
            --danger-hover: #dc2626;
            --border-color: #e2e8f0;    /* 연하고 깔끔한 테두리 */
        }

        /* 기본 초기화 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', 'Montserrat', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* -------------------------------------------------------------
           기존 HTML 구조를 그대로 스타일링 (클래스 추가 없이 태그/ID로만 매핑)
        ------------------------------------------------------------- */

        /* 1. 메인 컨테이너 및 모달 내부의 흰색 카드 공통 스타일링 */
        body > div:not([id$="Modal"]), 
        div[id$="Modal"] > div {
            background-color: var(--bg-card);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 16px 36px rgba(148, 163, 184, 0.12);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* 타이틀 */
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        /* 설명 텍스트 */
        p {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* 2. 타이머 폰트 스타일 및 컬러 최적화 */
        #timerDisplay {
            font-family: 'Montserrat', sans-serif;
            font-size: 4.5rem;
            font-weight: 700;
            color: var(--primary-blue);
            margin: 24px 0 36px 0;
            letter-spacing: -1px;
        }

        /* 3. 입력 폼 컴포넌트 세련되게 정돈 */
        label {
            display: block;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: #f1f5f9;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.2s ease-in-out;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary-blue);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        /* 4. 버튼 컴포넌트 (동일 높이와 둥글기로 통일감 부여) */
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            margin-bottom: 12px; /* 세로 배치 시 여백 조절 */
        }

        button:active {
            transform: scale(0.98);
        }

        /* 버튼 컬러 세부 지정 */
        #openSettingsBtn, #startTimerBtn {
            background-color: var(--primary-blue);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.2);
            margin-bottom: 0;
        }

        #openSettingsBtn:hover, #startTimerBtn:hover {
            background-color: var(--primary-hover);
        }

        #closeSettingsBtn, #closeConfirmBtn {
            background-color: #f1f5f9;
            color: var(--text-sub);
            margin-top: 12px;
            margin-bottom: 0;
        }

        #closeSettingsBtn:hover, #closeConfirmBtn:hover {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        #giveUpBtn, #finalGiveUpBtn {
            background-color: var(--danger-red);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.15);
            margin-bottom: 0;
        }

        #giveUpBtn:hover, #finalGiveUpBtn:hover {
            background-color: var(--danger-hover);
        }

        /* 벌칙 텍스트 강조 */
        #penaltyConfirmText {
            display: inline-block;
            font-weight: 700;
            color: var(--danger-red);
            background-color: #fef2f2;
            padding: 4px 10px;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid rgba(239, 68, 68, 0.1);
        }

        /* 5. 모달 오버레이 설정 (자바스크립트 내 style.display 제어 완벽 호환) */
        div[id$="Modal"] {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.2); /* 은은한 딤 처리 */
            backdrop-filter: blur(4px);             /* 뒤 배경을 고급스럽게 블러 처리 */
            display: none;                          /* JS 컨트롤 기본값 */
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        /* 모달 활성화 시 부드러운 등장 애니메이션 */
        div[id$="Modal"] > div {
            text-align: left; /* 설정 모달 내부 정렬은 왼쪽으로 차분하게 변경 */
            animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalFadeIn {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div>
        <h1>Habit Lock</h1>
        <p>나쁜 습관을 잠그고 시간에 몰입하세요</p>
        
        <div id="timerDisplay">25:00</div>
        
        <button id="openSettingsBtn">습관 잠금 시작하기</button>
        <button id="giveUpBtn" style="display: none;">포기하기</button>
    </div>

    <div id="settingsModal">
        <div>
            <h1>습관 잠금 설정</h1>
            <p>포기할 때 치를 대가와 제한 시간을 설정해 주세요.</p>
            
            <label>나쁜 습관 (또는 벌칙)</label>
            <input type="text" id="penaltyInput" placeholder="예: 유튜브 쇼츠 보기, 꿀밤 대가">
            
            <label>제한 시간</label>
            <select id="timeSelect">
                <option value="10">10분</option>
                <option value="25" selected>25분</option>
                <option value="50">50분</option>
                <option value="60">1시간</option>
            </select>
            
            <button id="startTimerBtn">잠금 시작</button>
            <button id="closeSettingsBtn">취소</button>
        </div>
    </div>

    <div id="confirmModal">
        <div>
            <h1>정말 포기하시겠습니까?</h1>
            <p>지금 포기하시면 설정하신 대가를 치러야 합니다:<br>
               <span id="penaltyConfirmText"></span>
            </p>
            <button id="finalGiveUpBtn">포기하기</button>
            <button id="closeConfirmBtn">계속 진행</button>
        </div>
    </div>

    <script>
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const startTimerBtn = document.getElementById('startTimerBtn');
        const giveUpBtn = document.getElementById('giveUpBtn');
        const closeConfirmBtn = document.getElementById('closeConfirmBtn');
        const finalGiveUpBtn = document.getElementById('finalGiveUpBtn');

        const settingsModal = document.getElementById('settingsModal');
        const confirmModal = document.getElementById('confirmModal');
        
        const timerDisplay = document.getElementById('timerDisplay');
        const penaltyInput = document.getElementById('penaltyInput');
        const timeSelect = document.getElementById('timeSelect');
        const penaltyConfirmText = document.getElementById('penaltyConfirmText');

        let countdown;
        let timeLeft;
        let isRunning = false;

        // 설정창 열기
        openSettingsBtn.addEventListener('click', () => {
            settingsModal.style.display = 'flex';
        });

        // 설정창 닫기
        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.style.display = 'none';
        });

        // 타이머 시작
        startTimerBtn.addEventListener('click', () => {
            const minutes = parseInt(timeSelect.value);
            timeLeft = minutes * 60;
            updateDisplay(timeLeft);
            settingsModal.style.display = 'none';
            
            openSettingsBtn.style.display = 'none';
            giveUpBtn.style.display = 'block';
            
            startTimer();
        });

        // 포기 확인창 열기
        giveUpBtn.addEventListener('click', () => {
            penaltyConfirmText.textContent = penaltyInput.value || "설정된 대가가 없습니다.";
            confirmModal.style.display = 'flex';
        });

        // 포기 취소 (계속 진행)
        closeConfirmBtn.addEventListener('click', () => {
            confirmModal.style.display = 'none';
        });

        // 최종 포기
        finalGiveUpBtn.addEventListener('click', () => {
            clearInterval(countdown);
            isRunning = false;
            timerDisplay.textContent = "25:00";
            
            confirmModal.style.display = 'none';
            openSettingsBtn.style.display = 'block';
            giveUpBtn.style.display = 'none';
        });

        function startTimer() {
            if (isRunning) return;
            isRunning = true;

            countdown = setInterval(() => {
                timeLeft--;
                updateDisplay(timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    isRunning = false;
                    alert("성공했습니다! 나쁜 습관을 이겨내셨군요.");
                    openSettingsBtn.style.display = 'block';
                    giveUpBtn.style.display = 'none';
                }
            }, 1000);
        }

        function updateDisplay(seconds) {
            const min = String(Math.floor(seconds / 60)).padStart(2, '0');
            const sec = String(seconds % 60).padStart(2, '0');
            timerDisplay.textContent = `${min}:${sec}`;
        }
    </script>
</body>
</html>
